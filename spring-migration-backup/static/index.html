<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHarvest 360 — API</title>
<style>
  :root { --bg:#0b1220; --card:#111a2e; --border:#1f2b45; --text:#e6edf7; --muted:#8fa3c0; --green:#34d399; --amber:#fbbf24; --blue:#60a5fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: radial-gradient(1200px 600px at 20% -10%, #16233f 0%, var(--bg) 55%); color: var(--text); min-height: 100vh; padding: 40px 20px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .logo { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg, #22c55e, #15803d); display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 6px 18px rgba(34,197,94,.25); }
  h1 { font-size: 26px; letter-spacing: .3px; }
  .sub { color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 8px; margin: 20px 0 22px; padding: 6px 14px; border-radius: 999px; background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.35); color: var(--green); font-weight: 600; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 22px; }
  .card h2 { font-size: 16px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid rgba(31,43,69,.6); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  code { font-family: Consolas, monospace; background: #0d1626; border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px; font-size: 13px; color: var(--blue); }
  .method { display: inline-block; min-width: 52px; text-align: center; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .get { background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.3); }
  .post { background: rgba(251,191,36,.12); color: var(--amber); border: 1px solid rgba(251,191,36,.3); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  button { background: var(--blue); border: none; color: #0b1220; font-weight: 700; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: filter .15s; }
  button:hover { filter: brightness(1.15); }
  pre { background: #0d1626; border: 1px solid var(--border); border-radius: 10px; padding: 16px; font-size: 12.5px; overflow: auto; max-height: 340px; color: #c9d8f0; font-family: Consolas, monospace; }
  .pill { font-size: 12px; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🌱</div>
    <div>
      <h1>SmartHarvest 360</h1>
      <div class="sub">Farm simulation REST API — Spring Boot backend</div>
    </div>
  </header>

  <div class="status"><span class="dot"></span>API online · session <span id="sessionId">…</span></div>

  <div class="card">
    <h2>🛠️ Try it live</h2>
    <div class="actions">
      <button onclick="demo('/api/crops/catalog')">Load crop catalog</button>
      <button onclick="demo('/api/simulation/state')">Simulation state</button>
      <button onclick="demo('/api/market/buyers')">Market buyers</button>
      <button onclick="demo('/api/report/history')">Season history</button>
    </div>
    <pre id="output">Click a button to call a GET endpoint and see its JSON.</pre>
  </div>

  <div class="card">
    <h2>📡 Endpoints</h2>
    <table>
      <thead><tr><th>Method</th><th>Path</th><th>Purpose</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" class="pill">Loading…</td></tr></tbody>
    </table>
  </div>

  <footer>SmartHarvest 360 · Spring Boot 4 · the visual React app is the next step of the migration</footer>
</div>

<script>
async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + " → HTTP " + res.status);
  return res.json();
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
async function demo(url) {
  var out = document.getElementById('output');
  out.textContent = "Fetching " + url + " …";
  try {
    var data = await getJson(url);
    out.textContent = "GET " + url + "\n\n" + JSON.stringify(data, null, 2);
  } catch (err) {
    out.textContent = "Error: " + err.message;
  }
}
(async function init() {
  try {
    var index = await getJson('/api');
    document.getElementById('sessionId').textContent = index.sessionId;
    var tbody = document.getElementById('rows');
    tbody.innerHTML = '';
    index.endpoints.forEach(function (e) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><span class="method ' + (e.method === 'GET' ? 'get' : 'post') + '">' + e.method + '</span></td>' +
                     '<td><code>' + esc(e.path) + '</code></td>' +
                     '<td>' + esc(e.purpose) + '</td>';
      tbody.appendChild(tr);
    });
  } catch (err) {
    document.getElementById('rows').innerHTML = '<tr><td colspan="3" class="pill">Could not reach /api: ' + esc(err.message) + '</td></tr>';
  }
})();
</script>
</body>
</html>
